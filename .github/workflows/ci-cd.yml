name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 📦 Requirements o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test qilish
        env:
          SECRET_KEY: "test-secret-key-faqat-ci-uchun"
          DEBUG: "False"
          DB_NAME: u13_django_test
          DB_USER: test
          DB_PASSWORD: 12
          DB_HOST: db
          DB_PORT: 5432
          GOOGLE_CLIENT_ID: "test-client-id"
          GOOGLE_CLIENT_SECRET: "test-client-secret"
        run: python manage.py test