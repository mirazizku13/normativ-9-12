name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 📦 Requirements o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test qilish
        env:
          SECRET_KEY: "test-secret-key-faqat-ci-uchun"
          DEBUG: "False"
          DB_NAME: u13_django_test
          DB_USER: test
          DB_PASSWORD: 12
          DB_HOST: db
          DB_PORT: 5432
          GOOGLE_CLIENT_ID: "test-client-id"
          GOOGLE_CLIENT_SECRET: "test-client-secret"
        run: python manage.py test

  build-and-push:
    name: 🚀 Build & Push (CD)
    runs-on: ubuntu-latest
    needs: test                                  # test'ga bog'liq
    if: github.event_name == 'push'              # PR'da push qilmaydi

    steps:
      - name: 📥 Kodni checkout qilish
        uses: actions/checkout@v4

      # Docker Hub'ga login (sirlar Settings > Secrets'da saqlanadi)
      - name: 🔐 Docker Hub'ga login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image build qilib, Docker Hub'ga push qilish
      - name: 🏗️ Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/forgetpass-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/forgetpass-web:${{ github.sha }}
